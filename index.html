const pktDay = value => new Date(+new Date(value) + 5 * 3600000).toISOString().slice(0, 10);

async function refresh(force=false){

    if(page==='reports')report=await api(`/api/report?user=${encodeURIComponent(reportUser||me().id)}&days=${days}`);

}

});
document.addEventListener('change',async e=>{
  const el=e.target;
  try{if(el.id==='dashboard-scope'){scope=el.value;await refresh(true);}
    if(el.id==='report-user'){reportUser=el.value;await refresh(true);}
    if(el.id==='period'){days=Number(el.value);await refresh(true);}
    if(el.id==='task-status'){taskStatus=el.value;$('#tasks-result').innerHTML=renderTaskResults();}
    if(el.id==='task-assignee'){taskAssignee=el.value;$('#tasks-result').innerHTML=renderTaskResults();}
    if(el.id==='conversation-kind'){$('#group-title').hidden=el.value!=='group';$('[name="title"]',el.form).required=el.value==='group';}
    if(el.id==='import-input'){await importFile(el.files[0]);el.value='';}
    if(el.id==='attachment-input'){
      const file=el.files[0];if(!file)return;if(file.size>5*1024*1024||!file.size)throw new Error('Choose a non-empty file up to 5 MB.');
      const dataUrl=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=()=>reject(new Error('This file could not be read.'));r.readAsDataURL(file);});
      pendingAttachment={name:file.name,size:file.size,data:String(dataUrl).split(',')[1]};delete $('#message-input').form.dataset.clientId;paintComposePreview();el.value='';
    }
  }catch(err){toast(err.message,true);}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(modalType)closeModal();else if(selectedWork)closeDrawer();else if(mobile){mobile=false;render();}}
  if(e.key==='Tab'){
    const scope=modalRoot.querySelector('[role=dialog]')||drawerRoot.querySelector('[role=dialog]');
    if(scope){const list=[...scope.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),a[href]')].filter(x=>x.getClientRects().length);if(list.length){const first=list[0],last=list.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}
  }
  if(e.key==='Enter'&&e.target.id==='global-search'){const q=e.target.value;page=has('view_all')?'all':'my';taskSearch=q;taskStatus='all';taskAssignee='all';clientFilter='';render();}
  if(e.key==='Enter'&&e.target.id==='chat-query'){chatQuery=e.target.value;threadMessages=[];loadMessages();}
  if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing&&e.target.id==='message-input'){e.preventDefault();e.target.form.requestSubmit();}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-work]:not(button)')){e.preventDefault();openWork(e.target.dataset.work);}
});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&me())refresh();});
try{document.documentElement.dataset.theme=localStorage.getItem('ilmix-theme')||'light';}catch{}
refresh(true);
})();
</script></body></html>
